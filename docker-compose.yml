# Local dev stack: web on http://localhost:5173, API on http://localhost:8010.
name: comickatha

services:
  api:
    build: ./api
    command: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8010:8000"
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_DIR: /app/storage
      # Docker on Windows does not forward file events into the container.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./api/app:/app/app
      - ./api/storage:/app/storage

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./web:/app
      # Keep the container's own node_modules (Linux binaries) instead of the Windows one.
      - /app/node_modules
    depends_on:
      - api
