[project]
name = "comickatha-api"
version = "0.1.0"
description = "Comickatha API: characters, stories and comic generation for kids."
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# The API is an app, not an installable package.
package = false
# Never pick up the conda or system Python; uv downloads 3.11 itself.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
